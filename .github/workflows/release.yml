name: Release

# Só roda quando alguém dispara à mão (Actions > Release > Run workflow). Nenhum push nem pull request aciona.
# Segredos (cadastrados na interface do GitHub, nunca no arquivo): ver docs/release.md.
#   RELEASE_ED25519_KEY      chave privada de assinatura do app do PC (hex, 64 caracteres)
#   ANDROID_KEYSTORE_B64     keystore .jks em base64        (opcional: sem eles o APK é pulado)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      rascunho:
        description: "Criar como rascunho (não aparece para o atualizador; revise e publique na interface)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  versao:
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.v.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Versão do build (app/version.json, já com o PATCH subido por scripts/build.sh)
        id: v
        env:
          RASCUNHO: ${{ inputs.rascunho }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          versao=$(python3 -c "import json; print(json.load(open('app/version.json'))['version'])")
          grep -q "^version = \"$versao\"" app/Cargo.toml || { echo "::error::app/Cargo.toml não está na versão $versao (rode scripts/build.sh)"; exit 1; }
          grep -q "\"version\": \"$versao\"" app/tauri.conf.json || { echo "::error::app/tauri.conf.json não está na versão $versao"; exit 1; }
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$RASCUNHO" != "true" ]; then
            echo "::error::release definitivo só a partir da main (esta é $GITHUB_REF); use rascunho para testar"; exit 1
          fi
          # A versão embutida no binário tem de ser maior que a última tag, senão o atualizador entra em laço.
          ultima=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -n "$ultima" ]; then
            python3 - "$versao" "${ultima#v}" <<'PY'
          import sys
          nova, antiga = (tuple(int(p) for p in v.split(".")) for v in sys.argv[1:3])
          if nova <= antiga:
              sys.exit(f"::error::a versão {sys.argv[1]} não é maior que a última tag v{sys.argv[2]}; rode scripts/build.sh e faça commit")
          PY
          fi
          if gh release view "v$versao" >/dev/null 2>&1; then
            echo "::error::o release v$versao já existe"; exit 1
          fi
          echo "versao=$versao" >> "$GITHUB_OUTPUT"

  linux:
    needs: versao
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock') }}
      - name: Compilar
        run: cargo build --release --locked -p renandrop
      - name: Binário do release
        run: |
          mkdir -p dist
          cp target/release/renandrop dist/renandrop-linux-x86_64
          chmod 755 dist/renandrop-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: renandrop-linux-x86_64
          path: dist/renandrop-linux-x86_64
          if-no-files-found: error

  windows:
    needs: versao
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock') }}
      - name: Compilar
        run: cargo build --release --locked -p renandrop
      - name: Binário do release
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/renandrop.exe dist/renandrop-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: renandrop-windows-x86_64.exe
          path: dist/renandrop-windows-x86_64.exe
          if-no-files-found: error

  android:
    needs: versao
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      RENANDROP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RENANDROP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RENANDROP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Segredos do Android presentes?
        id: ks
        run: |
          if [ -n "$KS_B64" ] && [ -n "$RENANDROP_KEYSTORE_PASSWORD" ] && [ -n "$RENANDROP_KEY_ALIAS" ] && [ -n "$RENANDROP_KEY_PASSWORD" ]; then
            echo "tem=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Segredos ANDROID_* ausentes: o release sai sem o RenanDrop.apk"
            echo "tem=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ks.outputs.tem == 'true'
      - uses: actions/setup-java@v4
        if: steps.ks.outputs.tem == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: APK assinado
        if: steps.ks.outputs.tem == 'true'
        run: |
          set -euo pipefail
          umask 077
          ks=$(mktemp)
          trap 'rm -f "$ks"' EXIT
          printf %s "$KS_B64" | base64 -d > "$ks"
          export RENANDROP_KEYSTORE="$ks"
          (cd android && ./gradlew --no-daemon :app:assembleRelease)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/RenanDrop.apk
      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.tem == 'true'
        with:
          name: RenanDrop.apk
          path: dist/RenanDrop.apk
          if-no-files-found: error

  publicar:
    needs: [versao, linux, windows, android]
    if: ${{ !cancelled() && needs.versao.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.android.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSAO: ${{ needs.versao.outputs.versao }}
      RASCUNHO: ${{ inputs.rascunho }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cli-${{ hashFiles('Cargo.lock') }}
      - name: Compilar o renandrop-cli (só o núcleo)
        run: cargo build --release --locked -p renandrop-core --bin renandrop-cli
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Assinar, conferir e publicar
        # O segredo só existe neste passo (não no cargo build nem nos outros).
        env:
          RELEASE_ED25519_KEY: ${{ secrets.RELEASE_ED25519_KEY }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_ED25519_KEY" ] || { echo "::error::segredo RELEASE_ED25519_KEY não cadastrado"; exit 1; }
          cli="$PWD/target/release/renandrop-cli"
          cd dist
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf %s "$RELEASE_ED25519_KEY" > "$key"
          for f in renandrop-linux-x86_64 renandrop-windows-x86_64.exe; do
            "$cli" sign "$f" --key "$key" --version "$VERSAO"
            # Confere com a chave pública embutida no código: pega segredo errado antes de publicar.
            "$cli" verify "$f" --version "$VERSAO"
          done
          # APK só entra se foi gerado (sem segredos ANDROID_* ele é pulado).
          binarios=(renandrop-linux-x86_64 renandrop-windows-x86_64.exe)
          [ -f RenanDrop.apk ] && binarios+=(RenanDrop.apk)
          sha256sum "${binarios[@]}" > SHA256SUMS
          arquivos=("${binarios[@]}" renandrop-linux-x86_64.sig renandrop-windows-x86_64.exe.sig SHA256SUMS)
          extra=()
          [ "$RASCUNHO" = "true" ] && extra+=(--draft)
          gh release create "v$VERSAO" "${arquivos[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "RenanDrop $VERSAO" --generate-notes "${extra[@]}"
