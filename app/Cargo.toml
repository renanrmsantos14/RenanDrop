[package]
name = "renandrop"
version = "0.0.1"
edition = "2021"
description = "RenanDrop: envio de arquivos entre seus aparelhos pela rede local ou pelo Tailscale"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
renandrop-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
notify-rust = "4"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
